name: Deploy Backend

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/i.petrenko1/geomarketing-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Основные сервисы (Dockerfile с ARG APP) ───────────────────────────

      - name: Build & Push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:api-gateway
          build-args: APP=api-gateway
          cache-from: type=gha,scope=api-gateway
          cache-to: type=gha,mode=max,scope=api-gateway

      - name: Build & Push core-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:core-service
          build-args: APP=core-service
          cache-from: type=gha,scope=core-service
          cache-to: type=gha,mode=max,scope=core-service

      - name: Build & Push review-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:review-service
          build-args: APP=review-service
          cache-from: type=gha,scope=review-service
          cache-to: type=gha,mode=max,scope=review-service

      - name: Build & Push ai-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:ai-service
          build-args: APP=ai-service
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,mode=max,scope=ai-service

      - name: Build & Push integration-service
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:integration-service
          build-args: APP=integration-service
          cache-from: type=gha,scope=integration-service
          cache-to: type=gha,mode=max,scope=integration-service

      # ── map-parser — отдельный Dockerfile (Debian + Chromium) ─────────────

      - name: Build & Push map-parser
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.map-parser
          push: true
          tags: ${{ env.IMAGE }}:map-parser
          cache-from: type=gha,scope=map-parser
          cache-to: type=gha,mode=max,scope=map-parser

      # ── Деплой на VPS ─────────────────────────────────────────────────────

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u i.petrenko1 --password-stdin
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:api-gateway
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:core-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:review-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:ai-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:integration-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:map-parser
            docker compose -f /var/www/site/docker-compose.prod.yml up -d
