name: Deploy Backend

on:
  push:
    branches: [master]

env:
  IMAGE: ghcr.io/i.petrenko1/geomarketing-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Основные сервисы (Dockerfile с ARG APP) ───────────────────────────

      - name: Build & Push api-gateway
        run: |
          docker build --build-arg APP=api-gateway -t ${{ env.IMAGE }}:api-gateway .
          docker push ${{ env.IMAGE }}:api-gateway

      - name: Build & Push core-service
        run: |
          docker build --build-arg APP=core-service -t ${{ env.IMAGE }}:core-service .
          docker push ${{ env.IMAGE }}:core-service

      - name: Build & Push review-service
        run: |
          docker build --build-arg APP=review-service -t ${{ env.IMAGE }}:review-service .
          docker push ${{ env.IMAGE }}:review-service

      - name: Build & Push ai-service
        run: |
          docker build --build-arg APP=ai-service -t ${{ env.IMAGE }}:ai-service .
          docker push ${{ env.IMAGE }}:ai-service

      - name: Build & Push integration-service
        run: |
          docker build --build-arg APP=integration-service -t ${{ env.IMAGE }}:integration-service .
          docker push ${{ env.IMAGE }}:integration-service

      # ── map-parser — отдельный Dockerfile (Debian + Chromium) ─────────────

      - name: Build & Push map-parser
        run: |
          docker build -f Dockerfile.map-parser -t ${{ env.IMAGE }}:map-parser .
          docker push ${{ env.IMAGE }}:map-parser

      # ── Деплой на VPS ─────────────────────────────────────────────────────

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u i.petrenko1 --password-stdin
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:api-gateway
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:core-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:review-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:ai-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:integration-service
            docker pull ghcr.io/i.petrenko1/geomarketing-platform:map-parser
            docker compose -f /var/www/site/docker-compose.prod.yml up -d
